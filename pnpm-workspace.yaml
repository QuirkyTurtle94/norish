packages:
  - apps/*
  - "!apps/quick-import-extension"
  - "!apps/docs"
  - "!apps/mobile"
  - packages/*
  - tooling/*

catalog:
  "@better-auth/api-key": 1.7.7
  "@better-auth/core": 1.7.7
  "@better-auth/utils": 0.4.2
  "@eslint/js": ^10.0.1
  "@heroicons/react": 2.2.0
  "@heroui/react": 3.2.6
  "@heroui/styles": 3.2.6
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/react-query": ^5.104.2
  "@testcontainers/postgresql": ^12.2.1
  "@testcontainers/redis": ^12.2.1
  "@trpc/client": ^11.19.0
  "@trpc/server": ^11.19.0
  "@trpc/tanstack-react-query": ^11.19.0
  "@types/archiver": ^8.0.0
  "@types/node": ^26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": ^6.1.2
  archiver: ^8.0.0
  better-auth: 1.7.7
  bullmq: ^6.3.14
  date-fns: ^4.4.0
  drizzle-orm: 0.45.4
  eslint: 10.12.0
  fuse.js: ^7.5.0
  html-entities: ^2.6.0
  ioredis: ^6.0.0
  jsdom: ^30.1.2
  jszip: 3.10.2
  next: 16.4.0
  pg: 8.23.1
  postcss: ^8.5.30
  prettier: ^3.9.10
  react: 19.3.0
  react-dom: 19.3.0
  server-only: ^0.0.1
  superjson: ^2.2.6
  tailwindcss: ^4.3.3
  trpc-to-openapi: ^3.3.0
  tsx: 4.23.15
  turbo: ^2.11.7
  typescript: 6.0.3
  vite: ^8.3.4
  vitest: ^5.0.4
  ws: 8.22.0
  zod: 4.6.7
  zod-openapi: ^5.4.6

nodeLinker: hoisted

# The AI transport hands an undici 8 dispatcher to Node's built-in fetch, which
# only Node 26 understands; on an older Node every AI call fails. Refuse early.
engineStrict: true

allowBuilds:
  "@heroui/shared-utils": true
  "@parcel/watcher": false
  "@swc/core": false
  "@tailwindcss/oxide": true
  cpu-features: false
  esbuild: true
  ffmpeg-static: true
  msgpackr-extract: false
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true

overrides:
  # Optional peers resolved once and never used; they only carried advisories.
  "@prisma/client": "-"
  "@tanstack/react-query": 5.104.2
  "@trpc/client": 11.19.0
  "@trpc/server": 11.19.0
  "@trpc/tanstack-react-query": 11.19.0
  "drizzle-kit>@esbuild-kit/esm-loader": "-"
  mysql2: "-"
  prisma: "-"
  # One zod across the workspaces, zod-openapi, trpc-to-openapi and better-auth:
  # a second copy breaks declaration emit with TS2742 errors naming
  # @norish/shared/node_modules/zod. Move the value, keep the pin.
  zod: 4.6.7
